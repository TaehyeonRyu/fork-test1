<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>테트리스 - 바이브 코딩 실습</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Consolas', monospace;
      color: #e2e8f0;
    }
    .game-container {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    #gameCanvas {
      border: 2px solid #334155;
      background: #0f172a;
      display: block;
    }
    .side-panel {
      width: 150px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
    }
    .panel-box h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #64748b;
      margin-bottom: 8px;
    }
    .panel-box .value {
      font-size: 28px;
      font-weight: bold;
      color: #e2e8f0;
    }
    #overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 16px;
      font-size: 24px;
      color: #f1f5f9;
    }
    #overlay.show { display: flex; }
    #restartBtn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 28px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Consolas', monospace;
    }
    #restartBtn:hover { background: #2563eb; }
    .canvas-wrapper { position: relative; }
    .controls {
      font-size: 12px;
      color: #475569;
      line-height: 1.8;
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="300" height="600"></canvas>
    <div id="overlay">
      <div>GAME OVER</div>
      <button id="restartBtn">다시 시작</button>
    </div>
  </div>
  <div class="side-panel">
    <div class="panel-box">
      <h3>점수</h3>
      <div class="value" id="scoreDisplay">0</div>
    </div>
    <div class="panel-box">
      <h3>레벨</h3>
      <div class="value" id="levelDisplay">1</div>
    </div>
    <div class="panel-box">
      <h3>라인</h3>
      <div class="value" id="linesDisplay">0</div>
    </div>
    <div class="panel-box controls">
      <h3>조작법</h3>
      ← → 이동<br>
      ↑ 회전<br>
      ↓ 빠르게<br>
    </div>
  </div>
</div>

<script>
// ============================================================
//  ■ 상수 정의
// ============================================================
const COLS       = 10;
const ROWS       = 20;
const BLOCK_SIZE = 30;

const SHAPES = {
  I: [[1, 1, 1, 1]],
  O: [[1, 1], [1, 1]],
  T: [[0, 1, 0], [1, 1, 1]],
  S: [[0, 1, 1], [1, 1, 0]],
  Z: [[1, 1, 0], [0, 1, 1]],
  L: [[1, 0], [1, 0], [1, 1]],
  J: [[0, 1], [0, 1], [1, 1]],
};

const COLORS = {
  I: '#00f0f0',
  O: '#f0f000',
  T: '#a000f0',
  S: '#00f000',
  Z: '#f00000',
  L: '#f0a000',
  J: '#0000f0',
};

const PIECE_TYPES = Object.keys(SHAPES);

// ============================================================
//  ■ 캔버스 초기화
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

// ============================================================
//  ■ 게임 상태 변수
// ============================================================
let board        = [];
let currentPiece = null;
let score        = 0;
let level        = 1;
let linesCleared = 0;
let gameOver     = false;
let lastTime     = 0;
let dropInterval = 1000;

// ============================================================
//  ■ 단일 블록 그리기 헬퍼
// ============================================================
function drawBlock(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
  // 윗면 하이라이트 (밝게)
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 1, 4);
}

// ============================================================
//  ■ initBoard() — 보드 초기화
// ============================================================
function initBoard() {
  board = [];
  for (let r = 0; r < ROWS; r++) {
    // 각 행을 null로 채운 배열로 추가
    board.push(new Array(COLS).fill(null));
  }
}

// ============================================================
//  ■ createPiece() — 새 블록 생성
// ============================================================
function createPiece() {
  // PIECE_TYPES 중 무작위로 블록 종류 선택
  const type  = PIECE_TYPES[Math.floor(Math.random() * PIECE_TYPES.length)];
  const shape = SHAPES[type];
  // x는 보드 가로 중앙, y는 최상단(0)에서 시작
  const x = Math.floor((COLS - shape[0].length) / 2);

  currentPiece = { shape, color: COLORS[type], x, y: 0 };
}

// ============================================================
//  ■ isCollision() — 충돌 감지
// ============================================================
function isCollision(piece, dx, dy) {
  for (let row = 0; row < piece.shape.length; row++) {
    for (let col = 0; col < piece.shape[row].length; col++) {
      // 블록이 없는 칸은 충돌 검사 생략
      if (!piece.shape[row][col]) continue;

      // 이동 후 실제 보드 좌표 계산
      const newX = piece.x + col + dx;
      const newY = piece.y + row + dy;

      // ① 왼쪽·오른쪽 벽 충돌
      if (newX < 0 || newX >= COLS) return true;
      // ② 바닥 충돌
      if (newY >= ROWS) return true;
      // ③ 다른 블록과 충돌 (행이 존재하는 경우만 검사)
      if (newY >= 0 && board[newY][newX] !== null) return true;
    }
  }
  return false; // 충돌 없음
}

// ============================================================
//  ■ rotate() — 90도 시계 방향 회전
// ============================================================
function rotate(shape) {
  const rows = shape.length;
  const cols = shape[0].length;
  // 회전 후 크기는 가로·세로가 뒤바뀜 (cols × rows)
  const rotated = Array.from({ length: cols }, () => new Array(rows).fill(0));
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      // 90도 시계 방향: (r, c) → (c, rows-1-r)
      rotated[c][rows - 1 - r] = shape[r][c];
    }
  }
  return rotated;
}

// ============================================================
//  ■ placePiece() — 현재 블록을 보드에 고정
// ============================================================
function placePiece() {
  for (let row = 0; row < currentPiece.shape.length; row++) {
    for (let col = 0; col < currentPiece.shape[row].length; col++) {
      // 값이 1인 칸만 보드에 색상 기록
      if (currentPiece.shape[row][col]) {
        board[currentPiece.y + row][currentPiece.x + col] = currentPiece.color;
      }
    }
  }
}

// ============================================================
//  ■ clearLines() — 완성된 줄 제거 및 점수 계산
// ============================================================
function clearLines() {
  // 1줄=100, 2줄=300, 3줄=500, 4줄=800 (테트리스 기본 점수)
  const points = [0, 100, 300, 500, 800];
  let count = 0;

  for (let r = ROWS - 1; r >= 0; r--) {
    // 모든 칸이 null이 아닌 행 = 가득 찬 행
    if (board[r].every(cell => cell !== null)) {
      board.splice(r, 1);                        // 해당 행 제거
      board.unshift(new Array(COLS).fill(null)); // 맨 위에 빈 행 추가
      r++;    // splice로 인덱스가 당겨졌으므로 재검사
      count++;
    }
  }

  if (count > 0) {
    score        += points[count] * level;              // 점수 누적
    linesCleared += count;                              // 총 클리어 라인 누적
    level         = Math.floor(linesCleared / 10) + 1; // 10줄마다 레벨업
    dropInterval  = Math.max(100, 1000 - (level - 1) * 100); // 레벨별 낙하 속도
  }
}

// ============================================================
//  ■ draw() — 매 프레임 화면 렌더링
// ============================================================
function draw() {
  // ① 배경 지우기
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 격자 선 (옅게)
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 0.5;
  for (let c = 0; c < COLS; c++) {
    ctx.beginPath();
    ctx.moveTo(c * BLOCK_SIZE, 0);
    ctx.lineTo(c * BLOCK_SIZE, canvas.height);
    ctx.stroke();
  }
  for (let r = 0; r < ROWS; r++) {
    ctx.beginPath();
    ctx.moveTo(0, r * BLOCK_SIZE);
    ctx.lineTo(canvas.width, r * BLOCK_SIZE);
    ctx.stroke();
  }

  // ② board 고정 블록 그리기 — null이 아닌 칸만 drawBlock 호출
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c]) drawBlock(c, r, board[r][c]);
    }
  }

  // ③ currentPiece 현재 낙하 중인 블록 그리기
  if (currentPiece) {
    for (let row = 0; row < currentPiece.shape.length; row++) {
      for (let col = 0; col < currentPiece.shape[row].length; col++) {
        if (currentPiece.shape[row][col]) {
          drawBlock(
            currentPiece.x + col,
            currentPiece.y + row,
            currentPiece.color
          );
        }
      }
    }
  }
}

// ============================================================
//  ■ 키보드 입력 처리
// ============================================================
document.addEventListener('keydown', (e) => {
  if (gameOver) return;
  if (!currentPiece) return;

  switch (e.key) {
    case 'ArrowLeft':
      // 왼쪽 이동 — 충돌 없을 때만 x 감소
      if (!isCollision(currentPiece, -1, 0)) currentPiece.x -= 1;
      break;

    case 'ArrowRight':
      // 오른쪽 이동 — 충돌 없을 때만 x 증가
      if (!isCollision(currentPiece, 1, 0)) currentPiece.x += 1;
      break;

    case 'ArrowDown':
      // 빠른 하강 — 충돌 없으면 y+1, 충돌이면 블록 고정 후 새 블록 생성
      if (!isCollision(currentPiece, 0, 1)) {
        currentPiece.y += 1;
      } else {
        placePiece();   // 현재 블록 보드에 고정
        clearLines();   // 완성된 줄 제거 + 점수 갱신
        updateUI();     // UI 갱신
        createPiece();  // 새 블록 생성
        // 새 블록 생성 즉시 충돌 = 게임 오버
        if (isCollision(currentPiece, 0, 0)) {
          gameOver = true;
          showGameOver();
        }
      }
      break;

    case 'ArrowUp': {
      // 블록 회전 — 회전 후 충돌이 없을 때만 shape 교체
      const rotatedShape = rotate(currentPiece.shape);
      const tempPiece = { ...currentPiece, shape: rotatedShape };
      if (!isCollision(tempPiece, 0, 0)) {
        currentPiece.shape = rotatedShape; // 충돌 없으면 회전 적용
      }
      // 충돌이면 기존 shape 유지 (아무것도 안 함)
      break;
    }
  }

  draw(); // 입력 즉시 화면 갱신
});

// ============================================================
//  ■ gameLoop() — requestAnimationFrame 게임 루프
// ============================================================
function gameLoop(timestamp) {
  if (gameOver) return; // 게임 오버 시 루프 종료

  // 이전 프레임과의 경과 시간 계산
  const deltaTime = timestamp - lastTime;

  // dropInterval 이상 경과했을 때 자동 하강 처리
  if (deltaTime > dropInterval) {
    if (!isCollision(currentPiece, 0, 1)) {
      // 아래 공간이 있으면 한 칸 하강
      currentPiece.y += 1;
    } else {
      // 더 내려갈 수 없으면 블록 고정
      placePiece();   // 보드에 고정
      clearLines();   // 줄 제거 + 점수 갱신
      updateUI();     // UI 갱신
      createPiece();  // 새 블록 생성
      // 새 블록 생성 즉시 충돌 = 보드 가득 참 → 게임 오버
      if (isCollision(currentPiece, 0, 0)) {
        gameOver = true;
        showGameOver();
        return; // 루프 종료
      }
    }
    lastTime = timestamp; // 마지막 하강 시각 갱신
  }

  draw();                          // 매 프레임 화면 렌더링
  requestAnimationFrame(gameLoop); // 다음 프레임 예약
}

// ============================================================
//  ■ UI 업데이트 헬퍼
// ============================================================
function updateUI() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('levelDisplay').textContent = level;
  document.getElementById('linesDisplay').textContent = linesCleared;
}

// ============================================================
//  ■ 게임 시작 / 재시작
// ============================================================
function startGame() {
  initBoard();
  score        = 0;
  level        = 1;
  linesCleared = 0;
  gameOver     = false;
  dropInterval = 1000;
  lastTime     = 0;

  createPiece();
  updateUI();

  document.getElementById('overlay').classList.remove('show');
  requestAnimationFrame(gameLoop);
}

document.getElementById('restartBtn').addEventListener('click', startGame);

function showGameOver() {
  document.getElementById('overlay').classList.add('show');
}

// 게임 시작!
startGame();
</script>
</body>
</html>
