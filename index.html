<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>테트리스 - 바이브 코딩 실습</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Consolas', monospace;
      color: #e2e8f0;
    }
    .game-container {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    #gameCanvas {
      border: 2px solid #334155;
      background: #0f172a;
      display: block;
    }
    .side-panel {
      width: 150px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
    }
    .panel-box h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #64748b;
      margin-bottom: 8px;
    }
    .panel-box .value {
      font-size: 28px;
      font-weight: bold;
      color: #e2e8f0;
    }
    /* 다음 블록 미리보기 캔버스 */
    #nextCanvas {
      display: block;
      margin-top: 4px;
    }
    #overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 16px;
      font-size: 24px;
      color: #f1f5f9;
    }
    #overlay.show { display: flex; }
    #restartBtn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 28px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Consolas', monospace;
    }
    #restartBtn:hover { background: #2563eb; }
    .canvas-wrapper { position: relative; }
    .controls {
      font-size: 12px;
      color: #475569;
      line-height: 1.8;
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="300" height="600"></canvas>
    <div id="overlay">
      <div>GAME OVER</div>
      <button id="restartBtn">다시 시작</button>
    </div>
  </div>
  <div class="side-panel">
    <div class="panel-box">
      <h3>점수</h3>
      <div class="value" id="scoreDisplay">0</div>
    </div>
    <div class="panel-box">
      <h3>레벨</h3>
      <div class="value" id="levelDisplay">1</div>
    </div>
    <div class="panel-box">
      <h3>라인</h3>
      <div class="value" id="linesDisplay">0</div>
    </div>

    <!-- ★ 추가: 다음 블록 미리보기 패널 -->
    <div class="panel-box">
      <h3>NEXT</h3>
      <canvas id="nextCanvas" width="120" height="80"></canvas>
    </div>

    <div class="panel-box controls">
      <h3>조작법</h3>
      ← → 이동<br>
      ↑ 회전<br>
      ↓ 빠르게<br>
      Space 즉시낙하<br>
    </div>
  </div>
</div>

<script>
// ============================================================
//  ■ 상수 정의
// ============================================================
const COLS       = 10;
const ROWS       = 20;
const BLOCK_SIZE = 30;

const SHAPES = {
  I: [[1, 1, 1, 1]],
  O: [[1, 1], [1, 1]],
  T: [[0, 1, 0], [1, 1, 1]],
  S: [[0, 1, 1], [1, 1, 0]],
  Z: [[1, 1, 0], [0, 1, 1]],
  L: [[1, 0], [1, 0], [1, 1]],
  J: [[0, 1], [0, 1], [1, 1]],
};

const COLORS = {
  I: '#00f0f0',
  O: '#f0f000',
  T: '#a000f0',
  S: '#00f000',
  Z: '#f00000',
  L: '#f0a000',
  J: '#0000f0',
};

const PIECE_TYPES = Object.keys(SHAPES);

// ============================================================
//  ■ 캔버스 초기화
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

// ★ 추가: 다음 블록 미리보기 캔버스
const nextCanvas = document.getElementById('nextCanvas');
const nextCtx    = nextCanvas.getContext('2d');

// ============================================================
//  ■ 게임 상태 변수
// ============================================================
let board        = [];
let currentPiece = null;
let nextPiece    = null;   // ★ 추가: 다음 블록 저장
let score        = 0;
let level        = 1;
let linesCleared = 0;
let gameOver     = false;
let lastTime     = 0;
let dropInterval = 1000;

// ============================================================
//  ■ 단일 블록 그리기 헬퍼 (메인 캔버스용)
// ============================================================
function drawBlock(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 1, 4);
}

// ============================================================
//  ■ initBoard() — 보드 초기화
// ============================================================
function initBoard() {
  board = [];
  for (let r = 0; r < ROWS; r++) {
    board.push(new Array(COLS).fill(null));
  }
}

// ============================================================
//  ■ createPiece() — 새 블록 생성
//  ★ 변경: nextPiece가 있으면 그것을 current로, 없으면 랜덤 생성
//           이후 nextPiece를 새로 랜덤 생성
// ============================================================
function createPiece() {
  // 첫 호출 시 nextPiece가 없으면 랜덤 생성
  if (!nextPiece) {
    nextPiece = randomPiece();
  }
  // nextPiece를 현재 블록으로 승격
  currentPiece = nextPiece;
  // x, y를 보드 기준으로 초기화 (미리보기 때는 x/y가 임시값)
  currentPiece.x = Math.floor((COLS - currentPiece.shape[0].length) / 2);
  currentPiece.y = 0;
  // 다음 블록을 새로 뽑음
  nextPiece = randomPiece();
  // 미리보기 갱신
  drawNextPiece();
}

// ★ 추가: 랜덤 블록 객체 생성 헬퍼 (x, y는 임시값 0)
function randomPiece() {
  const type  = PIECE_TYPES[Math.floor(Math.random() * PIECE_TYPES.length)];
  const shape = SHAPES[type];
  return { shape, color: COLORS[type], x: 0, y: 0 };
}

// ============================================================
//  ■ isCollision() — 충돌 감지
// ============================================================
function isCollision(piece, dx, dy) {
  for (let row = 0; row < piece.shape.length; row++) {
    for (let col = 0; col < piece.shape[row].length; col++) {
      if (!piece.shape[row][col]) continue;
      const newX = piece.x + col + dx;
      const newY = piece.y + row + dy;
      if (newX < 0 || newX >= COLS) return true;
      if (newY >= ROWS) return true;
      if (newY >= 0 && board[newY][newX] !== null) return true;
    }
  }
  return false;
}

// ============================================================
//  ■ rotate() — 90도 시계 방향 회전
// ============================================================
function rotate(shape) {
  const rows = shape.length;
  const cols = shape[0].length;
  const rotated = Array.from({ length: cols }, () => new Array(rows).fill(0));
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      rotated[c][rows - 1 - r] = shape[r][c];
    }
  }
  return rotated;
}

// ============================================================
//  ■ placePiece() — 현재 블록을 보드에 고정
// ============================================================
function placePiece() {
  for (let row = 0; row < currentPiece.shape.length; row++) {
    for (let col = 0; col < currentPiece.shape[row].length; col++) {
      if (currentPiece.shape[row][col]) {
        board[currentPiece.y + row][currentPiece.x + col] = currentPiece.color;
      }
    }
  }
}

// ============================================================
//  ■ clearLines() — 완성된 줄 제거 및 점수 계산
// ============================================================
function clearLines() {
  const points = [0, 100, 300, 500, 800];
  let count = 0;

  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r].every(cell => cell !== null)) {
      board.splice(r, 1);
      board.unshift(new Array(COLS).fill(null));
      r++;
      count++;
    }
  }

  if (count > 0) {
    score        += points[count] * level;
    linesCleared += count;
    level         = Math.floor(linesCleared / 10) + 1;
    dropInterval  = Math.max(100, 1000 - (level - 1) * 100);
  }
}

// ============================================================
//  ★ 추가: getGhostY() — 유령 블록의 최종 Y 위치 계산
//  현재 블록이 바닥까지 떨어졌을 때의 y 좌표를 반환
// ============================================================
function getGhostY() {
  let ghostY = currentPiece.y;
  // 충돌할 때까지 y를 1씩 증가
  while (!isCollision({ ...currentPiece, y: ghostY + 1 }, 0, 0)) {
    ghostY++;
  }
  return ghostY;
}

// ============================================================
//  ■ draw() — 매 프레임 화면 렌더링
// ============================================================
function draw() {
  // ① 배경 지우기
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 격자 선 (옅게)
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 0.5;
  for (let c = 0; c < COLS; c++) {
    ctx.beginPath();
    ctx.moveTo(c * BLOCK_SIZE, 0);
    ctx.lineTo(c * BLOCK_SIZE, canvas.height);
    ctx.stroke();
  }
  for (let r = 0; r < ROWS; r++) {
    ctx.beginPath();
    ctx.moveTo(0, r * BLOCK_SIZE);
    ctx.lineTo(canvas.width, r * BLOCK_SIZE);
    ctx.stroke();
  }

  // ② board 고정 블록 그리기
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c]) drawBlock(c, r, board[r][c]);
    }
  }

  // ★ 추가 ③: 유령 블록 그리기 (현재 블록이 떨어질 위치를 반투명하게 표시)
  if (currentPiece) {
    const ghostY = getGhostY();
    // 현재 위치와 다를 때만 그리기 (겹치면 생략)
    if (ghostY !== currentPiece.y) {
      for (let row = 0; row < currentPiece.shape.length; row++) {
        for (let col = 0; col < currentPiece.shape[row].length; col++) {
          if (currentPiece.shape[row][col]) {
            // 유령 블록: 테두리만, 반투명 처리
            ctx.strokeStyle = currentPiece.color;
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.35;
            ctx.strokeRect(
              (currentPiece.x + col) * BLOCK_SIZE + 1,
              (ghostY + row) * BLOCK_SIZE + 1,
              BLOCK_SIZE - 2,
              BLOCK_SIZE - 2
            );
            ctx.globalAlpha = 1.0; // 투명도 원복
          }
        }
      }
    }
  }

  // ④ currentPiece 현재 낙하 중인 블록 그리기
  if (currentPiece) {
    for (let row = 0; row < currentPiece.shape.length; row++) {
      for (let col = 0; col < currentPiece.shape[row].length; col++) {
        if (currentPiece.shape[row][col]) {
          drawBlock(
            currentPiece.x + col,
            currentPiece.y + row,
            currentPiece.color
          );
        }
      }
    }
  }
}

// ============================================================
//  ★ 추가: drawNextPiece() — 다음 블록 미리보기 캔버스 렌더링
// ============================================================
function drawNextPiece() {
  // 미리보기 캔버스 배경 지우기
  nextCtx.fillStyle = '#1e293b';
  nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

  if (!nextPiece) return;

  const NEXT_BLOCK = 22; // 미리보기용 블록 픽셀 크기
  const shape = nextPiece.shape;

  // 미리보기 캔버스 중앙에 배치
  const offsetX = Math.floor((nextCanvas.width  - shape[0].length * NEXT_BLOCK) / 2);
  const offsetY = Math.floor((nextCanvas.height - shape.length    * NEXT_BLOCK) / 2);

  for (let row = 0; row < shape.length; row++) {
    for (let col = 0; col < shape[row].length; col++) {
      if (shape[row][col]) {
        const px = offsetX + col * NEXT_BLOCK;
        const py = offsetY + row * NEXT_BLOCK;
        // 블록 채우기
        nextCtx.fillStyle = nextPiece.color;
        nextCtx.fillRect(px, py, NEXT_BLOCK - 1, NEXT_BLOCK - 1);
        // 윗면 하이라이트
        nextCtx.fillStyle = 'rgba(255,255,255,0.2)';
        nextCtx.fillRect(px, py, NEXT_BLOCK - 1, 3);
      }
    }
  }
}

// ============================================================
//  ■ 키보드 입력 처리
// ============================================================
document.addEventListener('keydown', (e) => {
  if (gameOver) return;
  if (!currentPiece) return;

  switch (e.key) {
    case 'ArrowLeft':
      if (!isCollision(currentPiece, -1, 0)) currentPiece.x -= 1;
      break;

    case 'ArrowRight':
      if (!isCollision(currentPiece, 1, 0)) currentPiece.x += 1;
      break;

    case 'ArrowDown':
      if (!isCollision(currentPiece, 0, 1)) {
        currentPiece.y += 1;
      } else {
        placePiece();
        clearLines();
        updateUI();
        createPiece();
        if (isCollision(currentPiece, 0, 0)) {
          gameOver = true;
          showGameOver();
        }
      }
      break;

    case 'ArrowUp': {
      const rotatedShape = rotate(currentPiece.shape);
      const tempPiece = { ...currentPiece, shape: rotatedShape };
      if (!isCollision(tempPiece, 0, 0)) {
        currentPiece.shape = rotatedShape;
      }
      break;
    }

    // ★ 추가: 스페이스바 — 하드 드롭 (바닥까지 즉시 낙하)
    case ' ':
      e.preventDefault(); // 페이지 스크롤 방지
      // 충돌할 때까지 y를 계속 증가
      while (!isCollision(currentPiece, 0, 1)) {
        currentPiece.y += 1;
      }
      // 바닥에 닿으면 즉시 고정 → 새 블록 생성
      placePiece();
      clearLines();
      updateUI();
      createPiece();
      if (isCollision(currentPiece, 0, 0)) {
        gameOver = true;
        showGameOver();
      }
      break;
  }

  draw();
});

// ============================================================
//  ■ gameLoop() — requestAnimationFrame 게임 루프
// ============================================================
function gameLoop(timestamp) {
  if (gameOver) return;

  const deltaTime = timestamp - lastTime;

  if (deltaTime > dropInterval) {
    if (!isCollision(currentPiece, 0, 1)) {
      currentPiece.y += 1;
    } else {
      placePiece();
      clearLines();
      updateUI();
      createPiece();
      if (isCollision(currentPiece, 0, 0)) {
        gameOver = true;
        showGameOver();
        return;
      }
    }
    lastTime = timestamp;
  }

  draw();
  requestAnimationFrame(gameLoop);
}

// ============================================================
//  ■ UI 업데이트 헬퍼
// ============================================================
function updateUI() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('levelDisplay').textContent = level;
  document.getElementById('linesDisplay').textContent = linesCleared;
}

// ============================================================
//  ■ 게임 시작 / 재시작
// ============================================================
function startGame() {
  initBoard();
  score        = 0;
  level        = 1;
  linesCleared = 0;
  gameOver     = false;
  dropInterval = 1000;
  lastTime     = 0;
  nextPiece    = null; // ★ 초기화

  createPiece(); // nextPiece도 내부에서 생성됨
  updateUI();

  document.getElementById('overlay').classList.remove('show');
  requestAnimationFrame(gameLoop);
}

document.getElementById('restartBtn').addEventListener('click', startGame);

function showGameOver() {
  document.getElementById('overlay').classList.add('show');
}

// 게임 시작!
startGame();
</script>
</body>
</html>
